<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-T8MLRJYJED"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-T8MLRJYJED");
    </script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="gnb">
      <div class="container gnb__inner">
        <a href="/" class="gnb__logo">
          <img
            class="gnb__logo-text"
            src="images/logo/panda-market-text.png"
            alt="판다마켓 홈"
          />
        </a>
        <a href="/login" class="gnb__login">로그인</a>
      </div>
    </header>

    <main>
      <section class="banner">
        <div class="container banner__inner">
          <div class="banner__content">
            <h1 class="banner__title">일상의 모든 물건을<br />거래해 보세요</h1>
            <a href="items/index.html" class="banner__button">구경하러 가기</a>
          </div>
          <img class="banner__image" src="images/home/first-image.png" alt="" />
        </div>
      </section>

      <section class="feature">
        <div class="feature__inner">
          <img
            class="feature__image"
            src="images/home/hot-item-image.png"
            alt="인기 상품 예시"
          />
          <div class="feature__content">
            <p class="feature__tag">Hot item</p>
            <h2 class="feature__title">인기 상품을<br />확인해 보세요</h2>
            <p class="feature__desc">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature feature--reverse">
        <div class="feature__inner">
          <div class="feature__content">
            <p class="feature__tag">Search</p>
            <h2 class="feature__title">구매를 원하는<br />상품을 검색하세요</h2>
            <p class="feature__desc">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <img
            class="feature__image"
            src="images/home/search-image.png"
            alt="상품 검색"
          />
        </div>
      </section>

      <section class="feature">
        <div class="feature__inner">
          <img
            class="feature__image"
            src="images/home/feature-register-image.png"
            alt="상품 등록 예시"
          />
          <div class="feature__content">
            <p class="feature__tag">Register</p>
            <h2 class="feature__title">판매를 원하는<br />상품을 등록하세요</h2>
            <p class="feature__desc">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="banner">
        <div class="container banner__inner">
          <div class="banner__content">
            <h2 class="banner__title">믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <img
            class="banner__image"
            src="images/home/bottom-banner.png"
            alt=""
          />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p class="footer__copyright">©codeit - 2026</p>

        <nav class="footer__links">
          <a href="privacy/index.html">Privacy Policy</a>
          <a href="faq/index.html">FAQ</a>
        </nav>

        <div class="footer__sns">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/icons/ic_facebook.png" alt="페이스북" />
          </a>
          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/icons/ic_twitter.png" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/icons/ic_youtube.png" alt="유튜브" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/icons/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
