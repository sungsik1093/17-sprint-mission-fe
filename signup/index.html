<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-T8MLRJYJED"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-T8MLRJYJED");
    </script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>

  <body>
    <main class="auth">
      <h1 class="sr-only">회원가입</h1>
      <a href="/" class="auth__logo">
        <img src="/images/logo/panda-market-logo-big.png" alt="판다마켓 홈" />
      </a>

      <form class="auth__form">
        <div class="auth__field">
          <label class="auth__label" for="email">이메일</label>
          <input
            class="auth__input"
            id="email"
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="auth__field">
          <label class="auth__label" for="nickname">닉네임</label>
          <input
            class="auth__input"
            id="nickname"
            name="nickname"
            type="text"
            placeholder="닉네임을 입력해주세요"
          />
        </div>
        <div class="auth__field">
          <label class="auth__label" for="password">비밀번호</label>
          <div class="auth__password">
            <input
              class="auth__input"
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button
              type="button"
              class="auth__eye"
              aria-label="비밀번호 보기"
            ></button>
          </div>
        </div>
        <div class="auth__field">
          <label class="auth__label" for="password-confirm"
            >비밀번호 확인</label
          >
          <div class="auth__password">
            <input
              class="auth__input"
              id="password-confirm"
              name="password-confirm"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
            <button
              type="button"
              class="auth__eye"
              aria-label="비밀번호 보기"
            ></button>
          </div>
        </div>
        <button type="submit" class="auth__submit">회원가입</button>
      </form>

      <div class="auth__social">
        <p class="auth__social-title">간편 로그인하기</p>
        <div class="auth__social-links">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/images/social/ic_google.png" alt="구글로 로그인" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/images/social/ic_kakao.png" alt="카카오톡으로 로그인" />
          </a>
        </div>
      </div>

      <p class="auth__switch">
        이미 회원이신가요?<a href="/login/index.html">로그인</a>
      </p>
    </main>
  </body>
</html>
